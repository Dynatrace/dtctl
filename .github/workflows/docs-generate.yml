name: Docs - Generated Reference Freshness

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'scripts/gen-docs/**'
      - 'scripts/stability/**'
      - 'docs/**'
      - 'makefile'
      - '.github/workflows/docs-generate.yml'
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'scripts/gen-docs/**'
      - 'scripts/stability/**'
      - 'docs/**'
      - 'makefile'
      - '.github/workflows/docs-generate.yml'

# No job here writes to the repo, so the default token stays read-only.
permissions:
  contents: read

jobs:
  check-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Regenerate reference docs
        run: make docs-generate

      - name: Fail if generated docs are stale
        run: |
          # `git add -N` records any brand-new (untracked) generated file as an
          # intent-to-add so `git diff` notices it too; a plain `git diff`
          # ignores untracked files, which would let a newly-created page (e.g. a
          # new PLAN entry, or a deleted page the generator recreated) slip
          # through as "up to date".
          git add -N -- docs/resources docs/README.md docs/COMMANDS.md docs/TOKEN_SCOPES.md scripts/gen-docs/INDEX.md
          if ! git diff --exit-code -- docs/resources docs/README.md docs/COMMANDS.md docs/TOKEN_SCOPES.md scripts/gen-docs/INDEX.md; then
            echo ""
            echo "❌ Generated reference docs are out of date."
            echo ""
            echo "📌 Solution: run 'make docs-generate' locally and commit the result:"
            echo ""
            echo "   make docs-generate"
            echo "   git add docs/resources docs/README.md docs/COMMANDS.md docs/TOKEN_SCOPES.md scripts/gen-docs/INDEX.md"
            echo "   git commit"
            exit 1
          fi
          echo "✅ Generated reference docs are up to date."

  # The job above only guards the <!-- GENERATED --> blocks. This one guards
  # everything around them: the overviews, examples, notes, and cross-links
  # that people write by hand and that no generator will ever correct.
  # The freshness gate in check-generated-docs proves the manifest matches the
  # tree. It cannot prove the tree still keeps yesterday's promise: deleting a
  # stable flag and regenerating satisfies it. This job compares the manifest
  # against the base branch instead, so a withdrawal has to be argued rather
  # than regenerated.
  check-stability-compat:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The comparison needs the base commit, which a shallow clone omits.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Test the compatibility check
        run: python3 -m unittest discover -s scripts/stability -v

      - name: Refuse a withdrawal of stable surface
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          make stability-compat STABILITY_BASE="origin/${{ github.base_ref }}"

  check-docs-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Check docs prose against the real CLI
        run: make docs-check
