name: Nix

on:
  pull_request_target:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - sdk/go.mod
      - sdk/go.sum
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - sdk/go.mod
      - sdk/go.sum

permissions:
  contents: read

jobs:
  vendor-hash:
    name: Update vendorHash
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Recompute vendorHash
        run: |
          sed -i -E 's|vendorHash = "sha256-[^"]+";|vendorHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=";|' flake.nix
          got=$(nix build .#dtctl --no-link 2>&1 | sed -n 's/^ *got: *//p' | head -n1 || true)
          if [ -z "$got" ]; then
            echo "Could not determine vendorHash"
            exit 1
          fi
          sed -i -E "s|vendorHash = \"sha256-[^\"]+\";|vendorHash = \"$got\";|" flake.nix

      - name: Verify
        run: nix build .#dtctl --no-link

      - name: Commit
        run: |
          if git diff --quiet flake.nix; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(nix): update vendorHash" flake.nix
          git push

  pr-vendor-hash:
    name: Update vendorHash on PR
    # Same-repo and dependabot branches only: a fork cannot be pushed to with
    # GITHUB_TOKEN, and untrusted code must not run with a write token.
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
      github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Recompute vendorHash
        run: |
          sed -i -E 's|vendorHash = "sha256-[^"]+";|vendorHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=";|' flake.nix
          got=$(nix build .#dtctl --no-link 2>&1 | sed -n 's/^ *got: *//p' | head -n1 || true)
          if [ -z "$got" ]; then
            echo "Could not determine vendorHash"
            exit 1
          fi
          sed -i -E "s|vendorHash = \"sha256-[^\"]+\";|vendorHash = \"$got\";|" flake.nix

      - name: Verify
        run: nix build .#dtctl --no-link

      - name: Commit
        run: |
          if git diff --quiet flake.nix; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(nix): update vendorHash" flake.nix
          git push
