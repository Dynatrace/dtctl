name: SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'

# No job here writes to the repo, so the default token stays read-only.
permissions:
  contents: read

jobs:
  test:
    name: SDK Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.9']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Download SDK dependencies
        working-directory: sdk
        run: go mod download

      - name: Verify SDK compiles
        working-directory: sdk
        shell: bash
        run: go build ./...

      - name: Run go vet
        working-directory: sdk
        shell: bash
        run: go vet ./...

      - name: Run SDK tests
        working-directory: sdk
        shell: bash
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

  checks:
    name: SDK Dependency & Import Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Check for forbidden dependencies
        run: make sdk-check-deps

      - name: Check for forbidden imports
        run: make sdk-check-imports
