name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here writes to the repo, so the default token stays read-only.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Check goimports formatting
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          goimports_output=$(goimports -local github.com/dynatrace-oss -l .)
          if [ -n "$goimports_output" ]; then
            echo "The following files are not properly formatted:"
            echo "$goimports_output"
            echo ""
            echo "Run 'make fmt' to fix formatting."
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo ""
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.1

  goreleaser-check:
    name: GoReleaser Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same action and `version: latest` as the release job, so a PR sees what the
      # next release would: an invalid config, or a property GoReleaser has since
      # deprecated. `check` exits non-zero on a deprecation too (exit 2), on
      # purpose. Not filtered on .goreleaser.yaml changes, because a new GoReleaser
      # release can deprecate a property without this repo touching the file.
      - name: Run goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: check

