name: Release

# Releases are driven by release-please but triggered MANUALLY — nothing happens
# on ordinary merges to main. Run this workflow from the Actions tab ("Run
# workflow") when you want to act on releases. Each run does ONE of two things,
# depending on repo state:
#
#   1. If there are releasable commits since the last release and no release PR is
#      merged yet → release-please opens/updates the release PR (version bump in
#      the manifest + pkg/version/version.go, plus generated notes). Review it.
#   2. After you merge that release PR → run this workflow AGAIN; release-please
#      detects the merged release PR, creates the git tag and GitHub Release, and
#      the gated build, sign and GoReleaser jobs below build, sign, and publish the
#      artifacts.
#
# So a full release is: dispatch → merge the release PR → dispatch again.
#
# WINDOWS SIGNING: dtctl.exe is Authenticode-signed by the Dynatrace cloud signing
# service before anything is packaged. Build compiles the release and hands both
# Windows executables to the reusable Dynatrace/dt-sign-service-actions workflow;
# GoReleaser then runs the full release again, and a build post-hook in
# .goreleaser.yaml swaps the signed executables in before archiving. The zips,
# their SBOMs, checksums.txt and its cosign bundle are therefore all produced over
# the signed binaries. (GoReleaser OSS cannot package a prebuilt dist/, hence the
# second run.) The signing service only trusts OIDC tokens issued for
# refs/heads/main, so always dispatch from main — a republish included.
#
# Note: release-please creates the tag with GITHUB_TOKEN, which would not trigger
# `on: push: tags` workflows anyway — that is why GoReleaser runs as a gated job
# in this same workflow rather than in a separate tag-triggered one.
#
# sdk/ is a second Go module in this repo, and Go resolves it by the tag
# `sdk/vX.Y.Z`. release-please only manages the root package, so the tag-sdk job
# below mirrors each release tag into the sdk namespace at the same commit. That
# is what makes the root module's `require github.com/dynatrace-oss/dtctl/sdk`
# resolvable for anyone importing e.g. pkg/engine — the local `replace` in go.mod
# is ignored downstream. verify-consumable then proves it from outside the repo.
#
# RECOVERY: tag-sdk only runs on the dispatch that creates the release, because
# that is the only run where release_created is true. If it fails then (transient
# API error), simply re-dispatching will NOT retry it — the release already exists,
# so release_created is false and the job is skipped, leaving a published release
# whose sdk tag is missing and which therefore cannot be imported. Re-dispatch with
# the `retag_sdk` input set to that release tag to create the sdk tag and re-verify.
#
# RECOVERY: if GoReleaser fails after release-please created the release (the tag
# exists, the GitHub Release has no artifacts), fix the cause on main and re-dispatch
# with `republish_tag` set to that tag. It skips release-please, checks out the tag
# unchanged and builds it with the .goreleaser.yaml of the dispatched ref, uploading
# into the existing release. The tag is never moved: the module proxy and checksum
# database have already recorded it.

on:
  workflow_dispatch:
    inputs:
      retag_sdk:
        description: >-
          Recovery only: release tag (e.g. v0.38.0) whose sdk/ tag is missing because
          the Tag SDK Module job failed after the release was created. Leave empty for
          a normal release.
        required: false
        type: string
        default: ''
      republish_tag:
        description: >-
          Recovery only: release tag (e.g. v0.40.0) whose GoReleaser job failed.
          Builds that tag with the .goreleaser.yaml of the ref this run is dispatched
          from and uploads into the existing release. Leave empty for a normal release.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  release-please:
    name: Release Please
    # A republish must not open or update a release PR for the fix commits.
    if: ${{ inputs.republish_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tag-sdk:
    name: Tag SDK Module
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.retag_sdk != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mirror the release tag into the sdk/ namespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.retag_sdk || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # TAG can come from a hand-typed recovery input, and a Go module tag is
          # effectively permanent once the proxy observes it. Reject anything that is
          # not a release tag rather than minting a ref nobody can retract.
          # Hyphens are disallowed inside the prerelease on purpose: that is what
          # rejects a Go pseudo-version (v0.0.0-00010101000000-000000000000) while
          # still accepting a release candidate (v0.36.0-rc.1). Kept in a variable
          # because an inline =~ pattern is parsed differently by other shells.
          release_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ ! "$TAG" =~ $release_tag_re ]]; then
            echo "::error::Refusing to tag: '$TAG' is not a release tag (vX.Y.Z[-rc.N])."
            exit 1
          fi
          # Resolve the commit release-please tagged, rather than trusting HEAD.
          # /commits/<ref> dereferences to a commit whether the tag is lightweight
          # or annotated; Go needs the tag to point at the commit either way.
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')
          echo "Release $TAG is at $sha"
          if gh api "repos/$REPO/git/ref/tags/sdk/$TAG" >/dev/null 2>&1; then
            echo "sdk/$TAG already exists — nothing to do."
            exit 0
          fi
          gh api "repos/$REPO/git/refs" \
            -f "ref=refs/tags/sdk/$TAG" \
            -f "sha=$sha" >/dev/null
          echo "Created sdk/$TAG at $sha"

  verify-consumable:
    name: Verify Module Is Importable
    needs: [release-please, tag-sdk]
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.retag_sdk != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Import pkg/engine from a module outside this repo
        env:
          TAG: ${{ inputs.retag_sdk || needs.release-please.outputs.tag_name }}
          # Fetch dtctl itself straight from GitHub: the tags were created seconds
          # ago, so neither the module proxy nor the checksum database has
          # observed them yet. Everything else still goes through the proxy.
          GOPRIVATE: github.com/dynatrace-oss/dtctl
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work"
          cd "$work"
          go mod init example.invalid/consumer
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"

          	"github.com/dynatrace-oss/dtctl/pkg/engine"
          )

          func main() {
          	fmt.Println(len(engine.UnsupportedCommands()))
          }
          EOF
          # Fails if go.mod's sdk require does not name a real sdk/vX.Y.Z tag —
          # the local `replace` that makes in-repo builds work is ignored here.
          go get "github.com/dynatrace-oss/dtctl@$TAG"
          go build ./...
          echo "pkg/engine is importable from an external module at $TAG"

  # The release is split in three so dtctl.exe can be Authenticode-signed before it
  # is packaged — see WINDOWS SIGNING at the top of this file.
  build:
    name: Build
    needs: release-please
    # !cancelled(): with republish_tag set, release-please is skipped, and a job
    # whose need was skipped is skipped too unless its condition says otherwise.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.republish_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A hand-typed tag is validated before anything is checked out.
      - name: Validate the republish tag
        if: ${{ inputs.republish_tag != '' }}
        env:
          TAG: ${{ inputs.republish_tag }}
        run: |
          set -euo pipefail
          release_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if [[ ! "$TAG" =~ $release_tag_re ]]; then
            echo "::error::Refusing to republish: '$TAG' is not a release tag (vX.Y.Z[-rc.N])."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified for a republish, so a branch that happens to be named
          # like the tag can never be built and published instead.
          ref: ${{ inputs.republish_tag != '' && format('refs/tags/{0}', inputs.republish_tag) || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Use the dispatched ref's GoReleaser config for a republish
        id: config
        if: ${{ inputs.republish_tag != '' }}
        env:
          TAG: ${{ inputs.republish_tag }}
          CONFIG_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "::error::HEAD is not the commit of tag $TAG ($tag_commit)."
            exit 1
          fi
          # Outside the checkout, so the tree GoReleaser builds stays clean at the tag.
          git show "$CONFIG_REF:.goreleaser.yaml" > "$RUNNER_TEMP/goreleaser.yaml"
          echo "args=--config $RUNNER_TEMP/goreleaser.yaml" >> "$GITHUB_OUTPUT"
          echo "Building $TAG ($(git rev-parse HEAD)) with .goreleaser.yaml from $CONFIG_REF"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: build --clean ${{ steps.config.outputs.args }}
        env:
          # The release commit also carries sdk/vX.Y.Z (tag-sdk), which is not a
          # semver tag; pin GoReleaser to the release tag so it never picks that one.
          GORELEASER_CURRENT_TAG: ${{ inputs.republish_tag || needs.release-please.outputs.tag_name }}

      # The sign workflow signs a file at the root of its input artifact, so the
      # executables are staged out of GoReleaser's dtctl_windows_<arch>_<variant>/
      # directories first; a wildcard in upload-artifact's path would keep them.
      - name: Stage unsigned Windows executables
        run: |
          set -euo pipefail
          mkdir -p unsigned/amd64 unsigned/arm64
          cp dist/dtctl_windows_amd64*/dtctl.exe unsigned/amd64/dtctl.exe
          cp dist/dtctl_windows_arm64*/dtctl.exe unsigned/arm64/dtctl.exe

      - name: Upload unsigned Windows amd64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-amd64
          path: unsigned/amd64/dtctl.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned Windows arm64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-arm64
          path: unsigned/arm64/dtctl.exe
          if-no-files-found: error
          retention-days: 1

  sign-windows-amd64:
    name: Sign Windows amd64
    needs: build
    permissions:
      contents: read
      id-token: write # Federates into the cloud signing service
    uses: Dynatrace/dt-sign-service-actions/.github/workflows/sign-windows.yml@v1
    with:
      unsigned-artifact-name: unsigned-windows-amd64
      file-to-sign: dtctl.exe
      signed-artifact-name: signed-windows-amd64
    # The sync pushes the Authenticode key and certificate under _AUTHENTICODE
    # names; the sign workflow takes them under its generic input names.
    secrets:
      SIGNING_GCP_PROJECT_ID: ${{ secrets.SIGNING_GCP_PROJECT_ID }}
      SIGNING_GCP_KMS_LOCATION: ${{ secrets.SIGNING_GCP_KMS_LOCATION }}
      SIGNING_GCP_KMS_KEYRING: ${{ secrets.SIGNING_GCP_KMS_KEYRING }}
      SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SIGNING_GCP_SERVICE_ACCOUNT: ${{ secrets.SIGNING_GCP_SERVICE_ACCOUNT }}
      SIGNING_GCP_KMS_KEY: ${{ secrets.SIGNING_GCP_KMS_KEY_AUTHENTICODE }}
      SIGNING_CODE_SIGNING_CERT: ${{ secrets.SIGNING_CODE_SIGNING_CERT_AUTHENTICODE }}

  sign-windows-arm64:
    name: Sign Windows arm64
    needs: build
    permissions:
      contents: read
      id-token: write # Federates into the cloud signing service
    uses: Dynatrace/dt-sign-service-actions/.github/workflows/sign-windows.yml@v1
    with:
      unsigned-artifact-name: unsigned-windows-arm64
      file-to-sign: dtctl.exe
      signed-artifact-name: signed-windows-arm64
    secrets:
      SIGNING_GCP_PROJECT_ID: ${{ secrets.SIGNING_GCP_PROJECT_ID }}
      SIGNING_GCP_KMS_LOCATION: ${{ secrets.SIGNING_GCP_KMS_LOCATION }}
      SIGNING_GCP_KMS_KEYRING: ${{ secrets.SIGNING_GCP_KMS_KEYRING }}
      SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.SIGNING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SIGNING_GCP_SERVICE_ACCOUNT: ${{ secrets.SIGNING_GCP_SERVICE_ACCOUNT }}
      SIGNING_GCP_KMS_KEY: ${{ secrets.SIGNING_GCP_KMS_KEY_AUTHENTICODE }}
      SIGNING_CODE_SIGNING_CERT: ${{ secrets.SIGNING_CODE_SIGNING_CERT_AUTHENTICODE }}

  goreleaser:
    name: GoReleaser
    needs: [release-please, sign-windows-amd64, sign-windows-arm64]
    # release-please is skipped for a republish (see build), so its result cannot
    # gate this job; both signatures must have succeeded either way.
    if: ${{ !cancelled() && needs.sign-windows-amd64.result == 'success' && needs.sign-windows-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for cosign keyless signing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same ref as the build job; republish_tag was validated there.
          ref: ${{ inputs.republish_tag != '' && format('refs/tags/{0}', inputs.republish_tag) || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Use the dispatched ref's GoReleaser config for a republish
        id: config
        if: ${{ inputs.republish_tag != '' }}
        env:
          CONFIG_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git show "$CONFIG_REF:.goreleaser.yaml" > "$RUNNER_TEMP/goreleaser.yaml"
          echo "args=--config $RUNNER_TEMP/goreleaser.yaml" >> "$GITHUB_OUTPUT"

      - name: Download signed Windows amd64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows-amd64
          path: ${{ runner.temp }}/signed/amd64

      - name: Download signed Windows arm64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows-arm64
          path: ${{ runner.temp }}/signed/arm64

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: dynatrace-oss
          repositories: homebrew-tap

      # SIGNED_WINDOWS_DIR switches on the build post-hook in .goreleaser.yaml that
      # replaces each freshly built dtctl.exe with its signed counterpart before
      # archiving, so every asset derived from the zips covers the signed binary.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean ${{ steps.config.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # By now tag-sdk has created sdk/vX.Y.Z on the same commit; see build.
          GORELEASER_CURRENT_TAG: ${{ inputs.republish_tag || needs.release-please.outputs.tag_name }}
          SIGNED_WINDOWS_DIR: ${{ runner.temp }}/signed
